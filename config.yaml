advanced:
  cache_size_mb: 1024
  cache_waveforms: true
  enable_batch_processing: false
  max_video_length: 3600
export:
  audio_bitrate: 320k
  output_format: mp4
  video_codec: libx264
  video_quality: high
gui:
  autosave: false
  autosave_interval: 300
  show_tooltips: true
  start_mode: wizard
  theme: dark
karaoke:
  default_style: classic
  font_family: Arial
  font_size: 48
  highlight_color: '#FFD700'
  outline_color: '#000000'
  outline_width: 2
  position: bottom
  primary_color: '#FFFFFF'
lyrics:
  confidence_threshold: 0.5
  language: auto
  whisper_model: large-v3
  word_level_timing: true
processing:
  audio_format: wav
  num_workers: 4
  output_dir: output/
  sample_rate: 44100
  temp_dir: temp/
uvr:
  batch_size: 4
  default_model: MDX_Net
  gpu_device: 0
  models_path: models/
  use_gpu: true
